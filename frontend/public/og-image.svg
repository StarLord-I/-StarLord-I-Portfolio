<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0C"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>

    <!-- Blue Gradient Accent -->
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5DEF"/>
      <stop offset="100%" stop-color="#4A7FF7"/>
    </linearGradient>

    <!-- Orange Gradient Accent -->
    <linearGradient id="orangeAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E25327"/>
      <stop offset="100%" stop-color="#E8734B"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#2E2E32" opacity="0.65"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="140" fill="#1B5DEF" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1080" cy="520" r="180" fill="#E25327" opacity="0.12" filter="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#2E2E32" stroke-width="2"/>

  <!-- Top Bar Wordmark -->
  <g transform="translate(64, 70)">
    <circle cx="8" cy="8" r="6" fill="#4A7FF7"/>
    <text x="24" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.02em">jiya.dev</text>
    <text x="115" y="14" fill="#9E9EA4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">// Star-Lord_I</text>
  </g>

  <!-- Availability Pill -->
  <g transform="translate(940, 64)">
    <rect width="196" height="34" rx="17" fill="#1C1C1E" stroke="#2E2E32" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#22C55E"/>
    <text x="34" y="22" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="0.05em">OPEN FOR ROLES</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(64, 180)">
    <!-- Category Pill -->
    <rect width="210" height="28" rx="6" fill="rgba(226, 83, 39, 0.15)" stroke="rgba(226, 83, 39, 0.4)" stroke-width="1"/>
    <text x="12" y="18" fill="#E8734B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="0.08em">MISSION CONTROL // 2026</text>

    <!-- Name -->
    <text x="0" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">Jiya Khan Pathan</text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#EDEDED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.01em">Frontend Engineer &amp; Creative Developer</text>

    <!-- Description -->
    <text x="0" y="172" fill="#9E9EA4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Crafting resilient, 60fps React applications with interactive Framer Motion physics.
    </text>
  </g>

  <!-- Terminal Preview Box (Right Side) -->
  <g transform="translate(64, 420)">
    <rect width="1072" height="136" rx="12" fill="#1C1C1E" stroke="#2E2E32" stroke-width="1.5"/>

    <!-- Traffic Lights -->
    <circle cx="24" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="24" r="6" fill="#27C93F"/>
    <text x="84" y="28" fill="#9E9EA4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">telemetry@jiya-dev:~</text>

    <line x1="0" y1="44" x2="1072" y2="44" stroke="#2E2E32" stroke-width="1"/>

    <!-- Terminal Command Line -->
    <text x="24" y="76" fill="#4A7FF7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">$ npx jiya-dev --stack</text>
    <text x="24" y="106" fill="#EDEDED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      React 19 • Tailwind CSS v4 • Framer Motion • Node.js • Express • Vite • REST APIs
    </text>
  </g>
</svg>
